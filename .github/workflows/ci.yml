name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

  unit-and-api:
    name: Unit and API (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit and API tests
        run: |
          pytest tests/unit tests/api -m "not slow" \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --html=report.html --self-contained-html

      - name: Check analyzer coverage threshold
        run: coverage report --include="app/analyzer.py" --fail-under=85

      - name: Verify the suite is order independent
        run: pytest tests/unit tests/api -m "not slow" --random-order -q

      - name: Verify the suite runs in parallel
        run: pytest tests/unit tests/api -m "not slow" -n auto -q

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: report.html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  ui:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run UI tests
        run: pytest tests/ui -q --tracing=retain-on-failure --screenshot=only-on-failure

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
