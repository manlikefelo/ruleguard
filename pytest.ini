[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: analyzer and helper logic, no HTTP layer
    api: HTTP contract tests through TestClient
    ui: browser tests driven by Playwright
    smoke: minimal path that must pass before anything else runs
    regression: pins a previously fixed defect
    security: tenant isolation, auth, injection-shaped input
    slow: takes more than a couple of seconds

addopts =
    --strict-markers
    --strict-config
    -ra

filterwarnings =
    error
    ignore::DeprecationWarning
